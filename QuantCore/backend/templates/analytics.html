{% extends 'base.html' %}
{% load static %}
{% block content %}
<head>
    <title>Stock Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{% static 'stock_analysis.css' %}">
</head>
<body>
<h1>Stock Analytics and Predictions</h1>

<div class="stock-container">
    <form id="stockForm">
        <label for="ticker">Enter Stock Ticker:</label>
        <input type="text" id="ticker" name="ticker" placeholder="e.g., AAPL" required>

        <label for="model">Choose Model:</label>
        <select id="model" name="model">
            <option value="pureneural">Pure Neural</option>
            <option value="hybridneural" selected>Neural Hybrid</option>
            <option value="xgboost">XGBoost</option>
        </select>

        <label for="futureDate" id="dateLabel" style="display:none;">
            Target Date (Optional):
        </label>
        <input type="date" id="futureDate" name="futureDate" style="display:none;">

        <button type="submit">Analyze</button>
    </form>

    <div id="loading" style="display:none;">Loading data, please wait...</div>
    <div id="error-message" class="error"></div>

    <div id="results" style="display:none;">
        <h2>Results</h2>
        <div class="results-grid">
            <div class="results-metrics" id="dynamicMetrics"></div>
            <div class="results-chart" id="dynamicCharts"></div>
        </div>
    </div>
</div>

<script>
let rocChartInstance = null;

const modelSelect = document.getElementById("model");
const dateInput = document.getElementById("futureDate");
const dateLabel = document.getElementById("dateLabel");

// Show date only for Pure Neural
modelSelect.addEventListener("change", function () {
    if (this.value === "pureneural") {
        dateInput.style.display = "inline-block";
        dateLabel.style.display = "inline-block";
    } else {
        dateInput.style.display = "none";
        dateLabel.style.display = "none";
        dateInput.value = "";
    }
});

document.getElementById("stockForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const ticker = document.getElementById("ticker").value.trim();
    const model = modelSelect.value;
    const loading = document.getElementById("loading");
    const errorMsg = document.getElementById("error-message");
    const results = document.getElementById("results");
    const metricsContainer = document.getElementById("dynamicMetrics");
    const chartsContainer = document.getElementById("dynamicCharts");

    loading.style.display = "block";
    errorMsg.textContent = "";
    results.style.display = "none";
    metricsContainer.innerHTML = "";
    chartsContainer.innerHTML = "";

    try {

        let url = `/api/analytics-data/?ticker=${ticker}&model=${model}`;

        if (model === "pureneural" && dateInput.value) {
            url += `&date=${dateInput.value}`;
        }

        const response = await fetch(url);
        const data = await response.json();
        loading.style.display = "none";

        if (!response.ok) {
            errorMsg.textContent = data.error || "Something went wrong.";
            return;
        }

        // ----------------------------
        // Dynamic Metric Rendering
        // ----------------------------
        Object.entries(data).forEach(([key, value]) => {

            if (key === "roc_curve") return;

            // Handle long term forecast separately
            if (key === "long_term_forecast" && typeof value === "object") {

                const sectionTitle = document.createElement("h3");
                sectionTitle.innerText = "Long Term Forecast";
                metricsContainer.appendChild(sectionTitle);

                Object.entries(value).forEach(([subKey, subValue]) => {

                    const p = document.createElement("p");
                    let formattedValue = subValue;

                    if (Array.isArray(subValue)) {
                        if (subKey.includes("confidence_interval")) {
                            formattedValue = `$${subValue[0].toFixed(2)} - $${subValue[1].toFixed(2)}`;
                        } else {
                            formattedValue = subValue.map(v =>
                                typeof v === "number" ? v.toFixed(4) : v
                            ).join(", ");
                        }
                    }

                    if (typeof subValue === "number") {
                        formattedValue = subValue.toFixed(4);
                    }

                    if (subKey.includes("price") && typeof subValue === "number") {
                        formattedValue = "$" + subValue.toFixed(2);
                    }

                    const prettyKey = subKey
                        .replace(/_/g, " ")
                        .replace(/\b\w/g, l => l.toUpperCase());

                    p.innerHTML = `<strong>${prettyKey}:</strong> ${formattedValue}`;
                    metricsContainer.appendChild(p);
                });

                return;
            }

            const p = document.createElement("p");
            let formattedValue = value;

            if (typeof value === "number") {
                formattedValue = Number.isInteger(value)
                    ? value
                    : value.toFixed(4);
            }

            if (key.toLowerCase().includes("accuracy")) {
                formattedValue = (value * 100).toFixed(2) + "%";
            }

            if (key.toLowerCase().includes("price")) {
                formattedValue = "$" + parseFloat(value).toFixed(2);
            }

            const prettyKey = key
                .replace(/_/g, " ")
                .replace(/\b\w/g, l => l.toUpperCase());

            p.innerHTML = `<strong>${prettyKey}:</strong> ${formattedValue}`;
            metricsContainer.appendChild(p);
        });

        // ----------------------------
        // ROC Chart Rendering
        // ----------------------------
        if (data.roc_curve && data.roc_curve.fpr && data.roc_curve.tpr) {

            const chartTitle = document.createElement("h3");
            chartTitle.innerText = "ROC Curve";
            chartsContainer.appendChild(chartTitle);

            const canvas = document.createElement("canvas");
            chartsContainer.appendChild(canvas);

            const aucText = document.createElement("p");
            aucText.innerHTML = `<strong>AUC:</strong> ${data.roc_curve.auc.toFixed(3)}`;
            chartsContainer.appendChild(aucText);

            if (rocChartInstance) {
                rocChartInstance.destroy();
            }

            rocChartInstance = new Chart(canvas.getContext("2d"), {
                type: "line",
                data: {
                    labels: data.roc_curve.fpr,
                    datasets: [
                        {
                            label: "ROC Curve",
                            data: data.roc_curve.tpr,
                            borderWidth: 2,
                            tension: 0.25,
                            fill: false
                        },
                        {
                            label: "Random",
                            data: data.roc_curve.fpr,
                            borderDash: [5,5],
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { min:0, max:1, title:{display:true, text:"False Positive Rate"} },
                        y: { min:0, max:1, title:{display:true, text:"True Positive Rate"} }
                    },
                    plugins: { legend:{ position:"bottom" } }
                }
            });
        }

        results.style.display = "block";

    } catch (error) {
        loading.style.display = "none";
        errorMsg.textContent = "Failed to fetch data.";
    }
});
</script>
</body>
{% endblock %}
